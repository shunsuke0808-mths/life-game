<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 人生ゲーム</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#0f0a2e 0%,#1a0a3d 50%,#0d1b3e 100%);
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  color:white;
}
#app{max-width:480px;margin:0 auto;padding:24px 16px 60px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

h1{font-size:32px;font-weight:bold;text-align:center;margin:8px 0 4px;background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
h2{color:#a78bfa;font-size:22px;margin:0 0 18px;}

input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #334155;background:rgba(255,255,255,.06);color:white;font-size:16px;outline:none;margin-bottom:10px;}
input::placeholder{color:#64748b;}
select option{background:#1e1b4b;}

.btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;font-weight:bold;font-size:15px;margin-bottom:10px;transition:filter .15s;}
.btn:hover{filter:brightness(1.15);}
.btn:disabled{background:#1e293b!important;color:#475569!important;cursor:not-allowed;}
.btn-primary{background:#7c3aed;color:white;}
.btn-secondary{background:rgba(255,255,255,.06);color:#a78bfa;border:1px solid #7c3aed;}
.btn-danger{background:#dc2626;color:white;}
.btn-yellow{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#000;}
.back-btn{background:none;border:none;color:#7c3aed;cursor:pointer;font-size:14px;margin-bottom:16px;padding:0;display:block;}

.stats-row{display:flex;gap:12px;margin-bottom:18px;}
.stat-card{flex:1;background:rgba(124,58,237,.15);border:1px solid #3730a3;border-radius:14px;padding:14px 8px;text-align:center;}
.stat-num{display:block;color:#a78bfa;font-size:26px;font-weight:bold;}
.stat-label{display:block;color:#64748b;font-size:12px;}

.money-big{font-size:28px;font-weight:bold;color:#fbbf24;background:rgba(251,191,36,.1);border:2px solid rgba(251,191,36,.25);border-radius:14px;padding:12px 20px;display:inline-block;margin:8px 0;}

.rank-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid #1e293b;border-radius:14px;padding:12px 14px;margin-bottom:8px;}
.rank-badge{width:36px;height:36px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;color:#94a3b8;flex-shrink:0;}

.sq-box{border-radius:16px;padding:18px;text-align:center;margin-bottom:18px;}
.sq-plus{background:rgba(74,222,128,.12);border:2px solid #4ade80;}
.sq-minus{background:rgba(248,113,113,.12);border:2px solid #f87171;}
.sq-job{background:rgba(251,191,36,.12);border:2px solid #fbbf24;}
.sq-salary{background:rgba(96,165,250,.12);border:2px solid #60a5fa;}
.sq-roulette{background:rgba(192,132,252,.12);border:2px solid #c084fc;}
.sq-goal{background:rgba(251,191,36,.2);border:2px solid #fbbf24;}

.profile-card{background:rgba(124,58,237,.15);border:2px solid #7c3aed;border-radius:18px;padding:20px;text-align:center;margin-bottom:20px;}

.tab-bar{display:flex;gap:8px;margin-bottom:18px;}
.tab-btn{flex:1;padding:8px 0;border-radius:10px;border:none;cursor:pointer;background:rgba(255,255,255,.05);color:#94a3b8;font-weight:bold;font-size:11px;}
.tab-btn.active{background:#7c3aed;color:white;}

.list-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid #1e293b;border-radius:12px;padding:11px 13px;margin-bottom:8px;}
.icon-btn{background:rgba(255,255,255,.06);border:none;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:14px;}
.qr-item{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.04);border:1px solid #1e293b;border-radius:14px;padding:14px;margin-bottom:12px;}
.add-box{background:rgba(124,58,237,.1);border:1px dashed #7c3aed;border-radius:14px;padding:14px;margin-top:14px;}
.add-box-title{color:#a78bfa;font-weight:bold;margin-bottom:10px;}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold;background:rgba(251,191,36,.15);border:1px solid #fbbf24;color:#fbbf24;margin-left:6px;}
.err{color:#f87171;font-size:13px;margin-bottom:8px;}
.hint{color:#64748b;font-size:12px;text-align:center;margin-top:10px;}

#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
.spinner{width:40px;height:40px;border:3px solid #1e293b;border-top:3px solid #7c3aed;border-radius:50%;animation:spin 1s linear infinite;}

/* ルーレット */
@keyframes rouletteSpin{
  0%{transform:translateY(0)}
  100%{transform:translateY(-100%)}
}
.roulette-window{
  width:100%;height:90px;overflow:hidden;border-radius:16px;
  border:3px solid #7c3aed;background:#0f0a2e;position:relative;
  margin:16px 0;
}
.roulette-window::before,.roulette-window::after{
  content:"";position:absolute;left:0;right:0;height:28px;z-index:2;pointer-events:none;
}
.roulette-window::before{top:0;background:linear-gradient(to bottom,#0f0a2e,transparent);}
.roulette-window::after{bottom:0;background:linear-gradient(to top,#0f0a2e,transparent);}
.roulette-highlight{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:50px;
  border-top:2px solid #fbbf24;border-bottom:2px solid #fbbf24;
  background:rgba(251,191,36,.08);z-index:1;pointer-events:none;
}
.roulette-track{display:flex;flex-direction:column;transition:none;}
.roulette-cell{
  height:50px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:bold;flex-shrink:0;gap:10px;
}
.cell-plus{color:#4ade80;}
.cell-minus{color:#f87171;}
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <p style="color:#a78bfa;margin-top:14px;">読み込み中…</p>
</div>
<div id="app" style="display:none;"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDVnfZLVMRKLr3frcvQ5AKNXNmqlcMapS8",
  authDomain: "life-game-a7a6c.firebaseapp.com",
  databaseURL: "https://life-game-a7a6c-default-rtdb.firebaseio.com",
  projectId: "life-game-a7a6c",
  storageBucket: "life-game-a7a6c.firebasestorage.app",
  messagingSenderId: "415410809237",
  appId: "1:415410809237:web:fb6f83471fa5d2e9bb2e9c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const INIT_MONEY = 300000;
const ADMIN_PASS = "1234";
let users = {}, squares = {}, jobs = {};
let adminTab = "squares";
let rankingListener = null;

// ローカルストレージでユーザーIDを管理
function getMyId(){ return localStorage.getItem("lifegame_uid"); }
function setMyId(id){ localStorage.setItem("lifegame_uid", id); }
function clearMyId(){ localStorage.removeItem("lifegame_uid"); }

function fmt(n){ return (n<0?"-¥":"¥")+Math.abs(n).toLocaleString(); }

function getTitle(money){
  if(money >= 1000000) return {icon:"👑", name:"大富豪"};
  if(money >= 700000)  return {icon:"💎", name:"富裕層"};
  if(money >= 400000)  return {icon:"😊", name:"中産階級"};
  if(money >= 200000)  return {icon:"😅", name:"庶民"};
  if(money >= 50000)   return {icon:"😰", name:"貧乏人"};
  if(money >= 0)       return {icon:"💸", name:"破産寸前"};
  return {icon:"💀", name:"借金まみれ"};
}
function qrUrl(text,size=180){ return "https://api.qrserver.com/v1/create-qr-code/?size="+size+"x"+size+"&data="+encodeURIComponent(text); }
function baseUrl(){ return location.href.split("?")[0].split("#")[0]; }
function getParam(key){ return new URLSearchParams(location.search).get(key); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function render(html){ document.getElementById("app").innerHTML=html; }
function stopRanking(){ if(rankingListener){db.ref("users").off("value",rankingListener);rankingListener=null;} }

async function loadAll(){
  const [us,sq,jo] = await Promise.all([
    db.ref("users").once("value"),
    db.ref("squares").once("value"),
    db.ref("jobs").once("value"),
  ]);
  users=us.val()||{}; squares=sq.val()||{}; jobs=jo.val()||{};
}

// ══════════════════════════════════════
// HOME
// ══════════════════════════════════════
function showHome(){
  stopRanking();
  const myId = getMyId();
  const me = myId ? users[myId] : null;

  render(`
    <div style="animation:fadeUp .4s ease both;text-align:center;">
      <div style="font-size:72px;margin-bottom:6px;">🎲</div>
      <h1>人生ゲーム</h1>
      <p style="color:#64748b;margin-bottom:20px;font-size:14px;">デジタル管理システム</p>

      ${me ? `
        <div class="profile-card">
          <p style="color:#a78bfa;font-size:13px;margin-bottom:4px;">ログイン中</p>
          <p style="color:white;font-size:22px;font-weight:bold;margin-bottom:6px;">${esc(me.name)}</p>
          ${me.job?`<p style="color:#fbbf24;font-size:13px;margin-bottom:10px;">💼 ${esc(me.job)}</p>`:`<p style="color:#64748b;font-size:13px;margin-bottom:10px;">職業マスを踏んで職業を決めよう！</p>`}
          <div style="background:rgba(251,191,36,.12);border:2px solid rgba(251,191,36,.4);border-radius:16px;padding:14px;margin-bottom:12px;">
            <div style="color:#94a3b8;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;">💰 現在の所持金</div>
            <div style="color:#fbbf24;font-size:36px;font-weight:bold;letter-spacing:-1px;">${fmt(me.money)}</div>
          </div>
          <div style="background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);border-radius:12px;padding:10px;margin-bottom:12px;">
            <div style="color:#94a3b8;font-size:11px;margin-bottom:2px;">📊 累計獲得金額</div>
            <div style="color:#a78bfa;font-size:22px;font-weight:bold;">${fmt(me.totalEarned||0)}</div>
          </div>
          <button class="btn btn-secondary" style="margin-bottom:0;" onclick="clearMyId();showHome();">👤 別のユーザーに切替</button>
        </div>
      ` : `
        <div style="background:rgba(255,255,255,.04);border:1px dashed #334155;border-radius:14px;padding:16px;margin-bottom:16px;">
          <p style="color:#64748b;font-size:14px;">まだ登録していません</p>
          <button class="btn btn-primary" style="margin-top:10px;margin-bottom:0;" onclick="showRegister()">👤 プレイヤー登録</button>
        </div>
      `}

      <div class="stats-row">
        <div class="stat-card"><span class="stat-num">${Object.keys(users).length}</span><span class="stat-label">プレイヤー</span></div>
        <div class="stat-card"><span class="stat-num">${Object.keys(squares).length}</span><span class="stat-label">マス数</span></div>
      </div>
      <button class="btn btn-primary" onclick="showRanking()">🏆 ランキングを見る</button>
      <button class="btn btn-secondary" onclick="showAdminLogin()">⚙️ 管理画面</button>
    </div>
  `);
}

// ══════════════════════════════════════
// REGISTER
// ══════════════════════════════════════
function showRegister(){
  stopRanking();
  // すでに登録済みならホームへ
  const myId = getMyId();
  if(myId && users[myId]){
    showHome(); return;
  }
  render(`
    <div style="animation:fadeUp .4s ease both;">
      <button class="back-btn" onclick="showHome()">← 戻る</button>
      <h2 style="text-align:center;">👤 プレイヤー登録</h2>
      <p style="color:#94a3b8;margin-bottom:24px;text-align:center;">ユーザー名を入力してゲームを始めよう！</p>
      <input id="reg-name" placeholder="ユーザー名を入力…" maxlength="20">
      <p id="reg-err" class="err" style="display:none;"></p>
      <button class="btn btn-primary" onclick="doRegister()">✅ 登録する</button>
      <p class="hint">初期資金：${fmt(INIT_MONEY)}</p>
    </div>
  `);
  setTimeout(()=>document.getElementById("reg-name")?.focus(),100);
}

async function doRegister(){
  const name=document.getElementById("reg-name").value.trim();
  if(!name) return;
  const snap=await db.ref("users").once("value");
  const cur=snap.val()||{};
  if(Object.values(cur).some(u=>u.name===name)){
    const e=document.getElementById("reg-err");
    e.textContent="⚠ そのユーザー名は既に使われています";
    e.style.display="block"; return;
  }
  const id="u_"+Date.now();
  const user={id,name,money:INIT_MONEY,totalEarned:0,job:null,createdAt:Date.now()};
  await db.ref("users/"+id).set(user);
  users[id]=user;
  setMyId(id); // スマホに保存！
  render(`
    <div style="animation:pop .4s ease both;text-align:center;">
      <div style="font-size:64px;">🎉</div>
      <h2 style="text-align:center;margin-top:10px;">登録完了！</h2>
      <p style="color:#e2e8f0;margin-bottom:10px;">ようこそ、<strong style="color:#fbbf24;">${esc(name)}</strong> さん！</p>
      <div class="money-big">${fmt(INIT_MONEY)}</div>
      <p style="color:#94a3b8;font-size:13px;margin-top:6px;">初期資金でゲームスタート！</p>
      <p style="color:#60a5fa;font-size:12px;margin-top:8px;">このスマホでマスQRを読めば自動で適用されます</p>
      <button class="btn btn-primary" style="margin-top:20px;" onclick="showHome()">🏠 ホームへ</button>
    </div>
  `);
}

// ══════════════════════════════════════
// ROULETTE - アニメーション付き
// ══════════════════════════════════════
async function showRoulette(sq, user, uid){
  // ルーレットのスロット設定を読み込む
  const snap = await db.ref("roulette_slots/"+sq.id).once("value");
  let slots = snap.val() ? Object.values(snap.val()) : [
    {label:"プラス！", type:"plus", amount:sq.amount},
    {label:"マイナス...", type:"minus", amount:sq.amount},
    {label:"プラス！", type:"plus", amount:sq.amount},
    {label:"マイナス...", type:"minus", amount:sq.amount},
  ];

  // スロット表示用HTML
  function cellHtml(s){
    const cls = s.type==="plus"?"cell-plus":"cell-minus";
    const sign = s.type==="plus"?"+":"-";
    return `<div class="roulette-cell ${cls}">${s.type==="plus"?"💚":"❤️"} <span>${esc(s.label)} ${sign}¥${Number(s.amount).toLocaleString()}</span></div>`;
  }

  // 無限ループ用にスロットを繰り返す
  const repeated = [...slots,...slots,...slots,...slots,...slots,...slots];
  const trackHtml = repeated.map(s=>cellHtml(s)).join("");

  render(`
    <div style="animation:fadeUp .4s ease both;text-align:center;">
      <div style="font-size:56px;margin-bottom:6px;">🎰</div>
      <h2 style="color:#c084fc;margin-bottom:4px;">ルーレット！</h2>
      <p style="color:#94a3b8;font-size:14px;margin-bottom:16px;">${esc(user.name)} さん、ボタンを押して止めよう！</p>

      <div class="roulette-window">
        <div class="roulette-highlight"></div>
        <div class="roulette-track" id="roulette-track">${trackHtml}</div>
      </div>

      <button class="btn btn-primary" id="roulette-btn" onclick="stopRoulette()" style="font-size:18px;padding:16px;">
        🛑 ストップ！
      </button>
      <p style="color:#64748b;font-size:12px;margin-top:8px;">タイミングよく止めよう！</p>
    </div>
  `);

  // アニメーション開始
  const track = document.getElementById("roulette-track");
  const cellH = 50;
  const total = slots.length * cellH;
  let pos = 0;
  let speed = 8;
  let stopping = false;
  let stopped = false;

  window._rouletteInterval = setInterval(()=>{
    if(stopped) return;
    if(stopping) speed = Math.max(speed * 0.94, 0.5);
    pos += speed;
    if(pos >= total * 3) pos = pos % total;
    track.style.transform = `translateY(-${pos}px)`;

    if(stopping && speed <= 0.6){
      // 止まる位置を最も近いセルの中央に合わせる
      clearInterval(window._rouletteInterval);
      const snapPos = Math.round(pos / cellH) * cellH;
      track.style.transition = "transform 0.3s ease";
      track.style.transform = `translateY(-${snapPos}px)`;
      stopped = true;

      // どのスロットに止まったか判定
      const idx = Math.round(snapPos / cellH) % slots.length;
      const result = slots[idx];
      const delta = result.type==="plus" ? result.amount : -result.amount;
      const before = user.money;
      const newMoney = before + delta;
      const newTotal = (user.totalEarned||0) + (delta>0?delta:0);

      setTimeout(async()=>{
        await db.ref("users/"+uid).update({money:newMoney, totalEarned:newTotal});
        users[uid]={...user,money:newMoney,totalEarned:newTotal};
        const gain = delta >= 0;
        render(`
          <div style="animation:pop .4s ease both;text-align:center;">
            <div style="font-size:72px;margin-bottom:6px;">${gain?"🎊":"💸"}</div>
            <h2 style="color:#c084fc;margin-bottom:4px;">🎰 結果！</h2>
            <p style="color:#94a3b8;font-size:14px;margin-bottom:16px;">${esc(user.name)} さん</p>
            <div style="background:${gain?"rgba(74,222,128,.12)":"rgba(248,113,113,.12)"};border:2px solid ${gain?"#4ade80":"#f87171"};border-radius:18px;padding:20px;margin-bottom:16px;">
              <div style="color:#94a3b8;font-size:13px;margin-bottom:4px;">${esc(result.label)}</div>
              <div style="color:${gain?"#4ade80":"#f87171"};font-size:42px;font-weight:bold;">${gain?"+":""}¥${Math.abs(delta).toLocaleString()}</div>
            </div>
            <div style="background:rgba(251,191,36,.1);border:2px solid rgba(251,191,36,.3);border-radius:14px;padding:14px;margin-bottom:20px;">
              <div style="color:#94a3b8;font-size:11px;margin-bottom:6px;">💰 所持金</div>
              <div style="display:flex;align-items:center;justify-content:center;gap:10px;">
                <span style="color:#64748b;font-size:15px;">¥${before.toLocaleString()}</span>
                <span style="color:#64748b;font-size:20px;">→</span>
                <span style="color:#fbbf24;font-weight:bold;font-size:26px;">¥${newMoney.toLocaleString()}</span>
              </div>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary" onclick="showRanking()">🏆 ランキング</button>
              <button class="btn btn-secondary" onclick="showHome()">🏠 ホーム</button>
            </div>
          </div>
        `);
      }, 400);
    }
  }, 16);

  window._rouletteSlotsCache = slots;
  window._rouletteState = {stopping, stopped};
}

function stopRoulette(){
  const btn = document.getElementById("roulette-btn");
  if(btn){ btn.disabled=true; btn.textContent="⏳ 止まる..."; }
  // グローバル変数で停止フラグを立てる
  // setIntervalのclosure内のstoppingを更新するためwindowに保存した関数を使う
  if(window._rouletteInterval){
    clearInterval(window._rouletteInterval);
    // 再度intervalを立て直してstopping=trueで実行
    const track = document.getElementById("roulette-track");
    if(!track) return;
    let pos = parseFloat(track.style.transform.replace("translateY(-","").replace("px)","")) || 0;
    let speed = 8;
    const slots = window._rouletteSlotsCache || [];
    const cellH = 50;
    const total = slots.length * cellH;

    window._rouletteInterval = setInterval(()=>{
      speed = Math.max(speed * 0.93, 0.4);
      pos += speed;
      if(pos >= total * 4) pos = pos % total;
      track.style.transform = `translateY(-${pos}px)`;

      if(speed <= 0.5){
        clearInterval(window._rouletteInterval);
        const snapPos = Math.round(pos / cellH) * cellH;
        track.style.transition = "transform 0.3s ease";
        track.style.transform = `translateY(-${snapPos}px)`;
        const idx = Math.round(snapPos / cellH) % (slots.length||1);
        const result = slots[idx] || slots[0];
        if(!result) return;

        setTimeout(async()=>{
          const myId = getMyId();
          const snap = await db.ref("users/"+myId).once("value");
          const user = snap.val(); if(!user) return;
          const delta = result.type==="plus" ? result.amount : -result.amount;
          const before = user.money;
          const newMoney = before + delta;
          const newTotal = (user.totalEarned||0) + (delta>0?delta:0);
          await db.ref("users/"+myId).update({money:newMoney, totalEarned:newTotal});
          users[myId]={...user,money:newMoney,totalEarned:newTotal};
          const gain = delta >= 0;
          render(`
            <div style="animation:pop .4s ease both;text-align:center;">
              <div style="font-size:72px;margin-bottom:6px;">${gain?"🎊":"💸"}</div>
              <h2 style="color:#c084fc;margin-bottom:4px;">🎰 結果！</h2>
              <p style="color:#94a3b8;font-size:14px;margin-bottom:16px;">${esc(user.name)} さん</p>

async function applySquare(squareId, uid){
  const sq=squares[squareId];
  const snap=await db.ref("users/"+uid).once("value");
  const user=snap.val(); if(!user) return;

  let delta=0, jobAssigned=null, rouletteResult=null;

  if(sq.type==="plus"){
    delta=sq.amount;
  } else if(sq.type==="minus"){
    delta=-sq.amount;
  } else if(sq.type==="salary"){
    const j=Object.values(jobs).find(j=>j.name===user.job);
    delta=j?j.salary:30000;
  } else if(sq.type==="job"){
    const jList=Object.values(jobs);
    if(jList.length===0){
      render(`<div style="text-align:center;padding:40px;"><p style="color:#f87171;">役職が登録されていません</p><button class="btn btn-primary" style="margin-top:16px;" onclick="showHome()">ホームへ</button></div>`);
      return;
    }
    jobAssigned=jList[Math.floor(Math.random()*jList.length)].name;
    delta=0;
  } else if(sq.type==="roulette"){
    // ルーレットはshowRouletteで別処理
    await showRoulette(sq, user, uid);
    return;
  } else if(sq.type==="bet"){
    // 賭けマスはshowBetで別処理
    await showBet(sq, user, uid);
    return;
  } else if(sq.type==="goal"){
    const goalMoney=user.money;
    const newTotal=(user.totalEarned||0)+goalMoney;
    await db.ref("users/"+uid).update({money:INIT_MONEY,totalEarned:newTotal});
    users[uid]={...user,money:INIT_MONEY,totalEarned:newTotal};
    render(`
      <div style="animation:pop .4s ease both;text-align:center;">
        <div style="font-size:64px;">🏁</div>
        <h2 style="text-align:center;color:#fbbf24;margin-top:10px;">ゴール！</h2>
        <p style="color:#e2e8f0;margin-bottom:8px;">${esc(user.name)} さん</p>

      </div>
    `); return;

  if(sq.type==="roulette"){

  const el = document.getElementById("bet-player-"+uid);
  const check = document.getElementById("bet-check-"+uid);
  if(window._betTargets.has(uid)){
    window._betTargets.delete(uid);
    el.style.borderColor = "#1e293b";
    el.style.background = "rgba(255,255,255,.04)";
    check.textContent = "　";
    check.style.background = "#334155";
    check.style.borderColor = "#475569";
  } else {
    window._betTargets.add(uid);

async function startBetRoulette(myUid){
  const amount = parseInt(document.getElementById("bet-amount")?.value) || 0;
  const targets = Array.from(window._betTargets || []);
  if(amount <= 0){ alert("賭ける金額を入力してください"); return; }
  if(targets.length === 0){ alert("対象プレイヤーを1人以上選んでください"); return; }

  const mySnap = await db.ref("users/"+myUid).once("value");
  const me = mySnap.val();
  if(!me){ return; }
  if(me.money < amount){ alert("所持金が足りません！"); return; }

  // ルーレット表示（勝ち/負け）
  const slots = [
    {label:"勝ち！相手から徴収", type:"win"},
    {label:"負け...相手に支払い", type:"lose"},
    {label:"勝ち！相手から徴収", type:"win"},
    {label:"負け...相手に支払い", type:"lose"},
    {label:"勝ち！相手から徴収", type:"win"},
    {label:"負け...相手に支払い", type:"lose"},
  ];

  function cellHtml(s){
    const cls = s.type==="win"?"cell-plus":"cell-minus";
    return `<div class="roulette-cell ${cls}">${s.type==="win"?"🎉":"💸"} <span>${s.label}</span></div>`;
  }
  const repeated = [...slots,...slots,...slots,...slots,...slots];
  const trackHtml = repeated.map(s=>cellHtml(s)).join("");

  const targetNames = targets.map(id=>esc(users[id]?.name||"?")).join("、");

  render(`
    <div style="animation:fadeUp .4s ease both;text-align:center;">
      <div style="font-size:56px;margin-bottom:6px;">🎯</div>
      <h2 style="color:#f97316;margin-bottom:4px;">賭けマス！</h2>
      <p style="color:#94a3b8;font-size:13px;margin-bottom:4px;">賭け金: <strong style="color:#fbbf24;">${fmt(amount)}</strong></p>
      <p style="color:#94a3b8;font-size:13px;margin-bottom:16px;">対象: <strong style="color:white;">${targetNames}</strong></p>
      <div class="roulette-window">
        <div class="roulette-highlight"></div>
        <div class="roulette-track" id="roulette-track">${trackHtml}</div>
      </div>
      <button class="btn btn-primary" id="roulette-btn" onclick="stopBetRoulette('${myUid}',${amount},'${targets.join(",")}')" style="font-size:18px;padding:16px;">
        🛑 ストップ！
      </button>
    </div>
  `);

  // ルーレット開始
  const track = document.getElementById("roulette-track");
  const cellH = 50;
  const total = slots.length * cellH;
  let pos = 0, speed = 8;
  window._betInterval = setInterval(()=>{
    pos += speed;
    if(pos >= total * 4) pos = pos % total;
    track.style.transform = `translateY(-${pos}px)`;
  }, 16);
  window._betPos = () => pos;
  window._betSlots = slots;
}

async function stopBetRoulette(myUid, amount, targetStr){
  const btn = document.getElementById("roulette-btn");
  if(btn){ btn.disabled=true; btn.textContent="⏳ 止まる..."; }
  if(!window._betInterval) return;
  clearInterval(window._betInterval);

  const slots = window._betSlots || [];
  const cellH = 50;
  const total = slots.length * cellH;
  const track = document.getElementById("roulette-track");
  let pos = parseFloat(track.style.transform.replace("translateY(-","").replace("px)","")) || 0;
  let speed = 8;

  window._betInterval = setInterval(async()=>{
    speed = Math.max(speed * 0.93, 0.4);
    pos += speed;
    if(pos >= total * 5) pos = pos % total;
    track.style.transform = `translateY(-${pos}px)`;

    if(speed <= 0.5){
      clearInterval(window._betInterval);
      const snapPos = Math.round(pos / cellH) * cellH;
      track.style.transition = "transform 0.3s ease";
      track.style.transform = `translateY(-${snapPos}px)`;
      const idx = Math.round(snapPos / cellH) % slots.length;
      const result = slots[idx];
      const isWin = result.type === "win";
      const targets = targetStr.split(",").filter(Boolean);

      setTimeout(async()=>{
        // 勝敗処理
        const mySnap = await db.ref("users/"+myUid).once("value");
        const me = mySnap.val();
        const updates = {};
        let totalDelta = 0;
        const targetNames = [];

        for(const tid of targets){
          const tSnap = await db.ref("users/"+tid).once("value");
          const t = tSnap.val();
          if(!t) continue;
          targetNames.push(t.name);
          if(isWin){
            // 勝ち: 相手から徴収
            const take = Math.min(amount, t.money); // 持ってる分だけ
            updates["users/"+tid+"/money"] = t.money - take;
            totalDelta += take;
          } else {
            // 負け: 相手に支払い
            updates["users/"+tid+"/money"] = t.money + amount;
            totalDelta -= amount;
          }
        }

        const newMyMoney = me.money + totalDelta;
        const newTotal = isWin ? (me.totalEarned||0) + totalDelta : (me.totalEarned||0);
        updates["users/"+myUid+"/money"] = newMyMoney;
        updates["users/"+myUid+"/totalEarned"] = newTotal;
        await db.ref().update(updates);

        // ローカルも更新
        await loadAll();

        const newTitle = getTitle(newMyMoney);
        render(`
          <div style="animation:pop .4s ease both;text-align:center;">
            <div style="font-size:72px;margin-bottom:6px;">${isWin?"🎉":"💸"}</div>
            <h2 style="color:${isWin?"#4ade80":"#f87171"};margin-bottom:4px;">${isWin?"勝ち！":"負け..."}</h2>
            <p style="color:#94a3b8;font-size:13px;margin-bottom:16px;">対象: ${targetNames.map(n=>esc(n)).join("、")}</p>
            <div style="background:${isWin?"rgba(74,222,128,.12)":"rgba(248,113,113,.12)"};border:2px solid ${isWin?"#4ade80":"#f87171"};border-radius:18px;padding:20px;margin-bottom:16px;">
              <div style="color:${isWin?"#4ade80":"#f87171"};font-size:42px;font-weight:bold;">${isWin?"+":""}${fmt(totalDelta)}</div>
            </div>
            <div style="background:rgba(251,191,36,.1);border:2px solid rgba(251,191,36,.3);border-radius:14px;padding:14px;margin-bottom:20px;">
              <div style="color:#94a3b8;font-size:11px;margin-bottom:4px;">💰 現在の所持金</div>
              <div style="color:#fbbf24;font-size:32px;font-weight:bold;">${fmt(newMyMoney)}</div>
              <div style="color:#fbbf24;font-size:13px;margin-top:4px;">${newTitle.icon} ${newTitle.name}</div>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary" onclick="showRanking()">🏆 ランキング</button>
              <button class="btn btn-secondary" onclick="showHome()">🏠 ホーム</button>
            </div>
          </div>
        `);
      }, 400);
    }
  }, 16);
}

      <div style="flex:1;">
        <div style="color:white;font-weight:bold;font-size:15px;">${esc(u.name)}${u.id===myId?`<span style="font-size:11px;color:#a78bfa;margin-left:6px;">👈 あなた</span>`:""}${u.job?`<span class="badge">💼 ${esc(u.job)}</span>`:""}</div>
        <div style="font-size:12px;color:#64748b;margin-top:2px;">所持金 ${fmt(u.money)}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-weight:bold;font-size:18px;color:#fbbf24;">${fmt(u.totalEarned||0)}</div>
        <div style="font-size:11px;color:#64748b;">累計獲得</div>
      </div>
    </div>
  `).join("");
  render(`
    <div style="animation:fadeUp .4s ease both;">
      <button class="back-btn" onclick="showHome()">← 戻る</button>
      <h2 style="text-align:center;">🏆 ランキング</h2>
      <div id="ranking-list">
        ${sorted.length?items:"<p style='color:#64748b;text-align:center;margin-top:30px;'>まだプレイヤーがいません</p>"}
      </div>
      <p class="hint" style="margin-top:14px;">※ リアルタイム自動更新</p>
    </div>
  `);
}

// ══════════════════════════════════════
// ADMIN LOGIN
// ══════════════════════════════════════
function showAdminLogin(){
  stopRanking();
  render(`
    <div style="animation:fadeUp .4s ease both;">
      <button class="back-btn" onclick="showHome()">← 戻る</button>
      <h2>🔒 管理者ログイン</h2>
      <p style="color:#94a3b8;margin-bottom:18px;">パスワードを入力してください</p>
      <input id="admin-pass" type="password" placeholder="パスワード">
      <p id="pass-err" class="err" style="display:none;">⚠ パスワードが違います</p>
      <button class="btn btn-primary" onclick="checkAdminPass()">ログイン</button>
    </div>
  `);
  setTimeout(()=>document.getElementById("admin-pass")?.focus(),100);
}

function checkAdminPass(){
  const val=document.getElementById("admin-pass").value;
  if(val===ADMIN_PASS){ showAdmin(); }
  else{ document.getElementById("pass-err").style.display="block"; }
}

// ══════════════════════════════════════
// ADMIN
// ══════════════════════════════════════
function showAdmin(tab){
  stopRanking();
  adminTab=tab||"squares";
  const tabs=[["squares","📋 マス"],["jobs","💼 役職"],["roulette","🎰 ルーレット"],["qr","📷 QR"],["reset","🗑 リセット"]];
  const tabBar=tabs.map(([k,l])=>`<button class="tab-btn ${adminTab===k?"active":""}" onclick="showAdmin('${k}')">${l}</button>`).join("");
  let content="";

  if(adminTab==="squares"){
    const typeColor={plus:"#4ade80",minus:"#f87171",job:"#fbbf24",salary:"#60a5fa",roulette:"#c084fc",goal:"#fbbf24",bet:"#f97316"};
    const list=Object.values(squares).map(s=>`
      <div class="list-item">
        <span style="flex:1;color:white;font-weight:bold;font-size:14px;">${esc(s.label)}</span>
        <span style="font-size:12px;color:${typeColor[s.type]||"white"};margin-right:6px;">
          ${s.type==="plus"?"+"+fmt(s.amount):s.type==="minus"?"-"+fmt(s.amount):s.type==="roulette"?"±"+fmt(s.amount):{job:"役職マス",salary:"給料マス",goal:"🏁ゴール",bet:"🎯賭けマス"}[s.type]||""}
        </span>
        <button class="icon-btn" onclick="editSquare('${s.id}')">✏️</button>
        <button class="icon-btn" onclick="deleteSquare('${s.id}')">🗑</button>
      </div>
    `).join("")||"<p style='color:#64748b;text-align:center;margin-bottom:10px;'>まだマスがありません</p>";
    content=`
      ${list}
      <div class="add-box">
        <p class="add-box-title">＋ マスを追加</p>
        <input id="new-sq-label" placeholder="マス名（例: 宝くじ当選）">
        <select id="new-sq-type" onchange="toggleAmountField()">
          <option value="plus">➕ プラスマス</option>
          <option value="minus">➖ マイナスマス</option>
          <option value="roulette">🎰 ルーレット</option>
          <option value="job">💼 役職マス</option>
          <option value="salary">💰 給料マス</option>
          <option value="goal">🏁 ゴール</option>
          <option value="bet">🎯 賭けマス</option>
        </select>
        <input id="new-sq-amount" type="number" placeholder="金額（円）">
        <button class="btn btn-primary" onclick="addSquare()">追加する</button>
      </div>`;
  }

  if(adminTab==="jobs"){
    const list=Object.values(jobs).map(j=>`
      <div class="list-item">
        <span style="flex:1;color:white;font-weight:bold;font-size:14px;">💼 ${esc(j.name)}</span>
        <span style="font-size:13px;color:#60a5fa;margin-right:6px;">給料 +${fmt(j.salary)}</span>
        <button class="icon-btn" onclick="editJob('${j.id}')">✏️</button>
        <button class="icon-btn" onclick="deleteJob('${j.id}')">🗑</button>
      </div>
    `).join("")||"<p style='color:#64748b;text-align:center;margin-bottom:10px;'>まだ役職がありません</p>";
    content=`
      ${list}
      <div class="add-box">
        <p class="add-box-title">＋ 役職を追加</p>
        <input id="new-job-name" placeholder="役職名（例: 社長）">
        <input id="new-job-salary" type="number" placeholder="給料（円）">
        <button class="btn btn-primary" onclick="addJob()">追加する</button>
      </div>`;
  }

  if(adminTab==="qr"){
    const regUrl=baseUrl()+"?page=register";
    const regQr=`
      <div class="qr-item" style="border-color:#7c3aed55;background:rgba(124,58,237,.08);">
        <img src="${qrUrl(regUrl,90)}" style="border-radius:8px;flex-shrink:0;">
        <div style="flex:1;">
          <div style="color:#a78bfa;font-weight:bold;margin-bottom:3px;">📋 プレイヤー登録（入口用）</div>
          <div style="font-size:10px;color:#475569;word-break:break-all;">${regUrl}</div>
        </div>
      </div>`;
    const typeColor={plus:"#4ade80",minus:"#f87171",job:"#fbbf24",salary:"#60a5fa",roulette:"#c084fc",goal:"#fbbf24",bet:"#f97316"};
    const items=Object.values(squares).map(s=>{
      const url=baseUrl()+"?page=square&id="+s.id;
      const amtLabel={plus:"+"+fmt(s.amount),minus:"-"+fmt(s.amount),roulette:"±"+fmt(s.amount),job:"役職マス",salary:"給料マス",goal:"🏁ゴール",bet:"🎯賭けマス"};
      return `
        <div class="qr-item">
          <img src="${qrUrl(url,90)}" style="border-radius:8px;flex-shrink:0;">
          <div style="flex:1;">
            <div style="color:white;font-weight:bold;margin-bottom:3px;">${esc(s.label)}</div>
            <div style="font-size:12px;color:${typeColor[s.type]||"white"};margin-bottom:3px;">${amtLabel[s.type]||""}</div>
            <div style="font-size:10px;color:#475569;word-break:break-all;">${url}</div>
          </div>
        </div>`;
    }).join("")||"<p style='color:#64748b;text-align:center;'>マスを追加するとQRが表示されます</p>";
    content=`<p style="color:#94a3b8;font-size:13px;margin-bottom:14px;">印刷して各マスに設置してください。</p>${regQr}${items}`;
  }

  if(adminTab==="roulette"){
    // ルーレットマス一覧を表示
    const roulSquares = Object.values(squares).filter(s=>s.type==="roulette");
    if(roulSquares.length===0){
      content=`<p style="color:#64748b;text-align:center;">ルーレットマスがまだありません。<br>マスタブでルーレットマスを追加してください。</p>`;
    } else {
      content = roulSquares.map(sq=>`
        <div style="background:rgba(192,132,252,.1);border:1px solid #c084fc;border-radius:14px;padding:14px;margin-bottom:16px;">
          <div style="color:white;font-weight:bold;font-size:16px;margin-bottom:12px;">🎰 ${esc(sq.label)}</div>
          <div id="rslots-${sq.id}"><p style="color:#64748b;font-size:13px;">読み込み中...</p></div>
          <div style="margin-top:10px;background:rgba(255,255,255,.04);border-radius:10px;padding:10px;">
            <p style="color:#a78bfa;font-size:13px;font-weight:bold;margin-bottom:8px;">＋ スロットを追加</p>
            <input id="rsl-label-${sq.id}" placeholder="表示名（例: 大当たり！）" style="margin-bottom:6px;">
            <select id="rsl-type-${sq.id}" style="margin-bottom:6px;">
              <option value="plus">💚 プラス</option>
              <option value="minus">❤️ マイナス</option>
            </select>
            <input id="rsl-amount-${sq.id}" type="number" placeholder="金額（円）" style="margin-bottom:6px;">
            <button class="btn btn-primary" style="margin-bottom:0;" onclick="addRouletteSlot('${sq.id}')">追加</button>
          </div>
        </div>
      `).join("");
      // 各スロット読み込み
      setTimeout(()=>roulSquares.forEach(sq=>loadRouletteSlots(sq.id)), 100);
    }
  }

  if(adminTab==="reset"){
    content=`
      <div style="text-align:center;">
        <p style="color:#94a3b8;margin-bottom:16px;">現在のプレイヤー数：<strong style="color:white;">${Object.keys(users).length}人</strong></p>
        <button class="btn btn-yellow" onclick="resetMoney()">💰 所持金をリセット（累計は保持）</button>
        <button class="btn btn-danger" onclick="confirmFullReset()">🗑 全プレイヤーを完全に削除</button>
      </div>`;
  }

  render(`
    <div style="animation:fadeUp .4s ease both;">
      <button class="back-btn" onclick="showHome()">← 戻る</button>
      <h2 style="text-align:center;">⚙️ 管理画面</h2>
      <div class="tab-bar">${tabBar}</div>
      ${content}
    </div>
  `);
}

function toggleAmountField(){
  const t=document.getElementById("new-sq-type")?.value;
  const f=document.getElementById("new-sq-amount");
  if(f) f.style.display=(t==="job"||t==="salary"||t==="goal"||t==="bet")?"none":"block";
}

async function addSquare(){
  const label=document.getElementById("new-sq-label")?.value.trim();
  const type=document.getElementById("new-sq-type")?.value;
  const amount=parseInt(document.getElementById("new-sq-amount")?.value)||0;
  if(!label){alert("マス名を入力してください");return;}
  if((type==="plus"||type==="minus"||type==="roulette")&&amount<=0){alert("金額を入力してください");return;}
  const id="sq_"+Date.now();
  await db.ref("squares/"+id).set({id,label,type,amount});
  squares[id]={id,label,type,amount}; showAdmin("squares");
}

async function deleteSquare(id){
  if(!confirm("このマスを削除しますか？")) return;
  await db.ref("squares/"+id).remove();
  delete squares[id]; showAdmin("squares");
}

function editSquare(id){
  const sq=squares[id]; if(!sq) return;
  const newLabel=prompt("マス名:",sq.label); if(newLabel===null) return;
  let newAmount=sq.amount;
  if(sq.type==="plus"||sq.type==="minus"||sq.type==="roulette") newAmount=parseInt(prompt("金額（円）:",sq.amount))||0;
  db.ref("squares/"+id).update({label:newLabel.trim(),amount:newAmount});
  squares[id]={...sq,label:newLabel.trim(),amount:newAmount}; showAdmin("squares");
}

async function addJob(){
  const name=document.getElementById("new-job-name")?.value.trim();
  const salary=parseInt(document.getElementById("new-job-salary")?.value)||0;
  if(!name){alert("役職名を入力してください");return;}
  if(salary<=0){alert("給料を入力してください");return;}
  const id="j_"+Date.now();
  await db.ref("jobs/"+id).set({id,name,salary});
  jobs[id]={id,name,salary}; showAdmin("jobs");
}

async function deleteJob(id){
  if(!confirm("この役職を削除しますか？")) return;
  await db.ref("jobs/"+id).remove();
  delete jobs[id]; showAdmin("jobs");
}

function editJob(id){
  const j=jobs[id]; if(!j) return;
  const newName=prompt("役職名:",j.name); if(newName===null) return;
  const newSalary=parseInt(prompt("給料（円）:",j.salary))||0;
  db.ref("jobs/"+id).update({name:newName.trim(),salary:newSalary});
  jobs[id]={...j,name:newName.trim(),salary:newSalary}; showAdmin("jobs");
}

async function loadRouletteSlots(sqId){
  const snap = await db.ref("roulette_slots/"+sqId).once("value");
  const el = document.getElementById("rslots-"+sqId);
  if(!el) return;
  if(!snap.exists()||!snap.val()){
    el.innerHTML=`<p style="color:#64748b;font-size:13px;margin-bottom:4px;">スロットがまだありません（デフォルト: 50/50）</p>`;
    return;
  }
  const slots = Object.entries(snap.val());
  el.innerHTML = slots.map(([k,s])=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;background:rgba(255,255,255,.04);border-radius:8px;padding:8px 10px;">
      <span style="flex:1;font-size:13px;color:${s.type==="plus"?"#4ade80":"#f87171"};">${s.type==="plus"?"💚":"❤️"} ${esc(s.label)} ¥${Number(s.amount).toLocaleString()}</span>
      <button class="icon-btn" onclick="deleteRouletteSlot('${sqId}','${k}')">🗑</button>
    </div>
  `).join("");
}

async function addRouletteSlot(sqId){
  const label = document.getElementById("rsl-label-"+sqId)?.value.trim();
  const type = document.getElementById("rsl-type-"+sqId)?.value;
  const amount = parseInt(document.getElementById("rsl-amount-"+sqId)?.value)||0;
  if(!label||amount<=0){alert("ラベルと金額を入力してください");return;}
  const id = "rs_"+Date.now();
  await db.ref("roulette_slots/"+sqId+"/"+id).set({label,type,amount});
  loadRouletteSlots(sqId);
  document.getElementById("rsl-label-"+sqId).value="";
  document.getElementById("rsl-amount-"+sqId).value="";
}

async function deleteRouletteSlot(sqId,slotId){
  if(!confirm("このスロットを削除しますか？")) return;
  await db.ref("roulette_slots/"+sqId+"/"+slotId).remove();
  loadRouletteSlots(sqId);
}

async function resetMoney(){
  if(!confirm("全員の所持金を"+fmt(INIT_MONEY)+"にリセットします。累計獲得額は保持されます。")) return;
  const updates={};
  Object.keys(users).forEach(uid=>updates["users/"+uid+"/money"]=INIT_MONEY);
  await db.ref().update(updates);
  Object.keys(users).forEach(uid=>users[uid].money=INIT_MONEY);
  alert("リセットしました！"); showAdmin("reset");
}

async function confirmFullReset(){
  if(!confirm("全プレイヤーを完全に削除します。元に戻せません。本当によろしいですか？")) return;
  await db.ref("users").remove();
  users={}; alert("削除しました。"); showAdmin("reset");
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
(async()=>{
  try{
    await loadAll();
    document.getElementById("loading").style.display="none";
    document.getElementById("app").style.display="block";
    const page=getParam("page");
    const id=getParam("id");
    if(page==="register")        showRegister();
    else if(page==="square"&&id) showSquare(id);
    else                         showHome();
  }catch(e){
    document.getElementById("loading").innerHTML=`<p style="color:#f87171;padding:20px;text-align:center;">エラー: ${e.message}</p>`;
  }
})();
</script>
